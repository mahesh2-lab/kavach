<script>
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const blogId = params.get('id');
    
    const blog = typeof blogData !== 'undefined' ? blogData.find(b => b.id === blogId) : null;
    
    if (blog) {
      document.title = blog.title + " | Kavach Fire Safety";
      document.getElementById('meta-category').textContent = blog.category;
      document.getElementById('meta-date').textContent = blog.date;
      document.getElementById('post-title').textContent = blog.title;
      document.getElementById('post-content').innerHTML = blog.content;
      document.getElementById('author-name').textContent = blog.author;
      document.getElementById('author-role').textContent = blog.role;
      
      document.getElementById('blog-header').style.display = 'block';
      document.getElementById('blog-article').style.display = 'block';
    } else {
      document.getElementById('error-msg').style.display = 'block';
    }
  });
</script>
